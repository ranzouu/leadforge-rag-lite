[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "leadforge-rag-lite"
version = "0.1.0"
description = "RAG local com retrieval e geração para políticas de prospecção"
authors = [{name = "Rayson", email = "seu-email@exemplo.com"}]
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
  "pydantic>=2.0",
  "httpx>=0.27",
  "pandas>=2.0",
  "rich>=13.0"
]

[project.scripts]
leadforge-rag = "leadforge_rag_lite.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
